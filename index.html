    .topbar-btn-group { display: flex; gap: 8px; }

      color: #e2e8f0; padding: 6px 12px; border-radius: 5px; font-size: 12px; cursor: pointer;
      transition: all 0.2s ease;
    }
    .topbar-btn:hover { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.2); }
    .topbar-btn.hidden { display: none; }
    #topbar-right { display: flex; gap: 8px; margin-left: auto; }

    #graph-container {
      position: fixed; top: 60px; left: 0; right: 0; bottom: 0; z-index: 2; overflow: hidden;
      transition: padding-right 0.25s ease;
    }
    svg#graph {
      width: 100%; height: 100%; display: block; background: #030a1a;
    }

      cursor: pointer; user-select: none; transition: all 0.15s ease;
      filter: drop-shadow(0 0 8px rgba(0,0,0,0.3));
    }
    .node-card:hover { filter: drop-shadow(0 0 16px rgba(0,0,0,0.5)); }
    .node-card.selected { filter: drop-shadow(0 0 24px rgba(255,255,255,0.4)); }
    .node-rect {
      stroke-width: 2; fill-opacity: 0.05; transition: all 0.15s ease;
    }
    .node-card:hover .node-rect { stroke-width: 2.5; fill-opacity: 0.1; }
    .node-card.selected .node-rect { stroke-width: 3; fill-opacity: 0.15; }
    .node-label { font-size: 12px; font-weight: 500; pointer-events: none; }
    .node-category { font-size: 10px; opacity: 0.7; pointer-events: none; }
    .expand-dot { font-size: 8px; opacity: 0.6; pointer-events: none; }

    .link {
      stroke: rgba(255,255,255,0.15); stroke-width: 1.5; fill: none; marker-end: url(#arrowhead);
    }
    .link.xlink {
      stroke-dasharray: 4,3; stroke: rgba(200,200,200,0.2); marker-end: url(#arrowhead-x);
    }
    #arrowhead { fill: rgba(255,255,255,0.15); }
    #arrowhead-x { fill: rgba(200,200,200,0.2); }

    #legend {
      position: fixed; bottom: 20px; left: 20px; z-index: 25;
      background: rgba(4,12,28,0.95); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px; padding: 12px; min-width: 160px; max-height: 300px; overflow-y: auto;
    }
    .legend-title { font-size: 12px; font-weight: 600; margin-bottom: 8px; color: #a78bfa; }
    .legend-item {
      display: flex; align-items: center; gap: 8px; padding: 6px; cursor: pointer;
      border-radius: 4px; transition: background 0.2s;

    .legend-item:hover { background: rgba(255,255,255,0.08); }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

    #panel {
      position: fixed; right: 0; top: 0; width: 400px; height: 100%;
      background: #07111f; border-left: 1px solid rgba(255,255,255,0.08);
      z-index: 30; overflow-y: auto; padding: 28px 24px 40px;
      transform: translateX(100%); transition: transform 0.25s ease;
    }
    #panel.open { transform: translateX(0); }
    #panel-close {
      position: absolute; top: 16px; right: 16px;
      background: transparent; border: none; color: rgba(255,255,255,0.4);
      font-size: 18px; cursor: pointer; padding: 4px;
    }
    #panel-close:hover { color: #e2e8f0; }

    #panel-depth-label {
      font-size: 11px; font-weight: 700; letter-spacing: 0.12em;
      color: #34d399; text-transform: uppercase; margin-bottom: 10px;
    }
    .panel-cat-badge {
      display: inline-block; padding: 3px 9px; border-radius: 4px;
      font-size: 11px; font-weight: 600; margin-bottom: 10px; border: 1px solid;
    }
    .panel-title { font-size: 28px; font-weight: 700; margin-bottom: 14px; color: #f1f5f9; line-height: 1.2; }
    .panel-desc { font-size: 14px; line-height: 1.6; margin-bottom: 20px; color: #94a3b8; }

    .panel-section {
      margin-bottom: 22px; padding-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .panel-section:last-child { border-bottom: none; }
    .panel-section-title {
      font-size: 13px; font-weight: 700; color: #e2e8f0; margin-bottom: 12px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .copy-btn {
      background: rgba(255,255,255,0.1); border: none; color: #e2e8f0;
      padding: 3px 8px; border-radius: 3px; font-size: 11px; cursor: pointer;
      transition: background 0.2s;
    }
    .copy-btn:hover { background: rgba(255,255,255,0.15); }

    .code-block {
      background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 6px; padding: 14px; font-family: 'Monaco', 'Menlo', monospace;
      font-size: 12px; line-height: 1.5; overflow-x: auto; color: #cbd5e1;
    }

    .panel-section p { font-size: 14px; line-height: 1.6; color: #94a3b8; }

    .panel-pills { display: flex; flex-wrap: wrap; gap: 8px; }
    .panel-pill {
      display: inline-flex; align-items: center; gap: 4px;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
      padding: 7px 14px; border-radius: 20px; font-size: 13px; cursor: pointer;
      transition: all 0.15s; color: #cbd5e1; white-space: nowrap;
    }
    .panel-pill:hover {
      background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.22);
      color: #f1f5f9;
    }
    .panel-pill.pill-tool {
      background: rgba(52,211,153,0.07); border-color: rgba(52,211,153,0.2);
      color: #a7f3d0;
    }
    .panel-pill.pill-tool:hover {
      background: rgba(52,211,153,0.12); border-color: rgba(52,211,153,0.35);
    }

    #panel-breadcrumb {
      display: flex; align-items: center; flex-wrap: wrap; gap: 4px;
      margin-bottom: 12px; font-size: 12px;
    }
    .bc-item {
      color: #38bdf8; cursor: pointer; transition: color 0.15s;
      text-decoration: underline; text-decoration-color: rgba(56,189,248,0.35);
      text-underline-offset: 2px;
    }
    .bc-item:hover { color: #7dd3fc; text-decoration-color: rgba(125,211,252,0.6); }
    .bc-item.bc-current { color: #64748b; cursor: default; text-decoration: none; }
    .bc-sep { color: #334155; font-size: 10px; }

    #panel-back {
      display: none; align-items: center; gap: 6px;
      background: rgba(56,189,248,0.08); border: 1px solid rgba(56,189,248,0.2);
      color: #38bdf8; padding: 7px 14px; border-radius: 8px;
      font-size: 13px; cursor: pointer; transition: all 0.15s;
      margin-bottom: 18px; width: fit-content;
    }
    #panel-back:hover { background: rgba(56,189,248,0.14); border-color: rgba(56,189,248,0.35); }
    #panel-back.visible { display: flex; }

    .path-item {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 12px 14px; border-radius: 10px;

    .path-item:hover { background: rgba(255,255,255,0.07); border-color: rgba(255,255,255,0.14); }
    .path-num {
      min-width: 22px; height: 22px; border-radius: 50%;

      font-size: 11px; font-weight: 700; flex-shrink: 0; margin-top: 1px;

    .path-node-name { font-size: 14px; font-weight: 600; color: #e2e8f0; margin-bottom: 3px; }
    .path-note { font-size: 12px; color: #475569; line-height: 1.4; }

    #kb-hints {
      position: fixed; bottom: 20px; right: 20px; z-index: 25;
      background: rgba(4,12,28,0.95); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px; padding: 12px; font-size: 11px; max-width: 200px;
    }
    .kb-hint { margin: 4px 0; color: #a78bfa; }
    .kb-hint strong { color: #34d399; }

    .search-highlight { animation: pulse-glow 0.6s ease-in-out; }
    @keyframes pulse-glow {
      0%, 100% { filter: drop-shadow(0 0 8px rgba(52,211,153,0.6)); }
      50% { filter: drop-shadow(0 0 16px rgba(52,211,153,1)); }
    }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.25); }
  </style>

const RICH={numpy:{use:'Array math for preprocessing, matrix ops, and vectorized computation.',code:`import numpy as np\na = np.array([[1,2],[3,4]])\nprint(np.linalg.eigvals(a))\n# Cosine similarity between two vectors\nv1, v2 = np.random.randn(768), np.random.randn(768)\nsim = np.dot(v1,v2)/(np.linalg.norm(v1)*np.linalg.norm(v2))\nprint(f'cosine sim: {sim:.4f}')`,tip:'Use float32, not float64 — LLMs work in float32 and it halves memory usage.'},pytorch_t:{use:'Core tensor library for all deep learning in PyTorch.',code:`import torch\nx = torch.randn(2, 3, requires_grad=True, device='cuda')\ny = (x ** 2).mean()\ny.backward()\nprint(x.grad)\n# Use bfloat16 for LLM training\nx = x.to(torch.bfloat16)`,tip:'Always use bfloat16 for LLM training — more numerically stable than float16.'},adam:{use:'Default optimizer for training transformers and fine-tuning LLMs.',code:`import torch\nfrom torch.optim import AdamW\nmodel = MyModel()\noptimizer = AdamW(\n    model.parameters(),\n    lr=2e-4,\n    betas=(0.9, 0.999),\n    weight_decay=0.01  # AdamW decouples L2\n)\n# With cosine LR schedule\nfrom transformers import get_cosine_schedule_with_warmup\nscheduler = get_cosine_schedule_with_warmup(\n    optimizer, num_warmup_steps=100,\n    num_training_steps=1000\n)`,tip:'Use AdamW (not Adam) for transformers — weight decay is decoupled correctly.'},flash_attn:{use:'Drop-in attention replacement for 2-4× faster training and inference.',code:`# pip install flash-attn --no-build-isolation\nfrom flash_attn import flash_attn_qkvpacked_func\nimport torch\nqkv = torch.randn(2, 128, 3, 16, 64,\n    dtype=torch.float16, device='cuda')\nout = flash_attn_qkvpacked_func(qkv, dropout_p=0.0)\nprint(out.shape)  # (2, 128, 16, 64)\n# Or with HuggingFace (auto-enabled):\n# model = AutoModel.from_pretrained(...,\n#     attn_implementation='flash_attention_2')`,tip:'Requires A100/H100 with CUDA 11.6+. Pass dtype=torch.bfloat16 for stability.'},paged_attn:{use:'Core of vLLM — enables continuous batching and high GPU utilization.',code:`# pip install vllm\nfrom vllm import LLM, SamplingParams\nllm = LLM(model='meta-llama/Meta-Llama-3-8B-Instruct')\nparams = SamplingParams(\n    temperature=0.7, top_p=0.9, max_tokens=512\n)\nprompts = ['Explain attention in one paragraph.']\noutputs = llm.generate(prompts, params)\nprint(outputs[0].outputs[0].text)`,tip:'Set gpu_memory_utilization=0.90 to leave headroom. Use tensor_parallel_size for multi-GPU.'},spec_dec:{use:'Speed up inference 2-3× using a small draft model for token proposals.',code:`from transformers import AutoModelForCausalLM, AutoTokenizer\nimport torch\nass_model = AutoModelForCausalLM.from_pretrained(\n    'facebook/opt-125m', torch_dtype=torch.float16).cuda()\ntarget = AutoModelForCausalLM.from_pretrained(\n    'facebook/opt-1.3b', torch_dtype=torch.float16).cuda()\ntok = AutoTokenizer.from_pretrained('facebook/opt-1.3b')\ninputs = tok('Hello world', return_tensors='pt').to('cuda')\n# HF handles speculative decoding via assistant_model\nout = target.generate(**inputs,\n    assistant_model=ass_model, max_new_tokens=50)\nprint(tok.decode(out[0]))`,tip:'Use a 7B target + 1B draft. Both must share the same tokenizer.'},gpt4o:{use:'Best for multimodal tasks, complex reasoning, and agentic workflows.',code:`from openai import OpenAI\nclient = OpenAI()\n# Vision + text\nresponse = client.chat.completions.create(\n    model='gpt-4o',\n    messages=[{\n        'role': 'user',\n        'content': [\n            {'type': 'text', 'text': 'What is in this image?'},\n            {'type': 'image_url',\n             'image_url': {'url': 'https://example.com/img.jpg'}}\n        ]\n    }]\n)\nprint(response.choices[0].message.content)`,tip:'Use max_completion_tokens not max_tokens for o-series models.'},claude35:{use:'Top choice for coding, analysis, and long-context document tasks.',code:`import anthropic\nclient = anthropic.Anthropic()\nmessage = client.messages.create(\n    model='claude-3-5-sonnet-20241022',\n    max_tokens=1024,\n    system='You are an expert Python developer.',\n    messages=[{\n        'role': 'user',\n        'content': 'Review this code for bugs: def add(a,b): return a-b'\n    }]\n)\nprint(message.content[0].text)`,tip:'Claude excels at following complex multi-step instructions. Put key constraints in the system prompt.'},zero_cot:{use:'When the model is making reasoning errors on multi-step math or logic.',code:`from openai import OpenAI\nclient = OpenAI()\ndef cot_solve(problem: str) -> str:\n    response = client.chat.completions.create(\n        model='gpt-4o',\n        messages=[\n            {'role': 'system', 'content':\n             'Think step by step before answering.'},\n            {'role': 'user', 'content': problem}\n        ]\n    )\n    return response.choices[0].message.content\nanswer = cot_solve('If I have 3 apples and give away 1.5, how many remain?')\nprint(answer)`,tip:'Add "Show your work" for math. Add "List your assumptions first" for logic problems.'},scratchpad:{use:'Complex multi-step reasoning where intermediate steps need to be hidden.',code:`import anthropic\nclient = anthropic.Anthropic()\nresponse = client.messages.create(\n    model='claude-3-5-sonnet-20241022',\n    max_tokens=8000,\n    thinking={\n        'type': 'enabled',\n        'budget_tokens': 5000\n    },\n    messages=[{'role': 'user',\n        'content': 'Prove that sqrt(2) is irrational.'}]\n)\nfor block in response.content:\n    if block.type == 'thinking':\n        print('THINKING:', block.thinking[:200])\n    else:\n        print('ANSWER:', block.text)`,tip:'budget_tokens controls how much the model reasons. More budget = slower but more accurate.'},self_consist:{use:'High-stakes questions where single path reasoning might be unreliable.',code:`from openai import OpenAI\nfrom collections import Counter\nclient = OpenAI()\ndef self_consistency(question, n=5):\n    responses = []\n    for _ in range(n):\n        r = client.chat.completions.create(\n            model='gpt-4o-mini',\n            messages=[\n                {'role': 'system', 'content': 'Think step by step. End with ANSWER: <answer>'},\n                {'role': 'user', 'content': question}\n            ],\n            temperature=0.7\n        )\n        text = r.choices[0].message.content\n        if 'ANSWER:' in text:\n            responses.append(text.split('ANSWER:')[-1].strip())\n    return Counter(responses).most_common(1)[0][0]\nprint(self_consistency('What is 17 * 24?'))`,tip:'Use temperature 0.5-0.8 for diversity. n=5 is sweet spot for cost vs accuracy.'},dspy:{use:'When you need to optimize prompts programmatically using labeled examples.',code:`import dspy\nlm = dspy.LM('openai/gpt-4o-mini')\ndspy.configure(lm=lm)\nclass QA(dspy.Signature):\n    """Answer questions with a short factual response."""\n    question: str = dspy.InputField()\n    answer: str = dspy.OutputField(desc='1-3 words')\npredict = dspy.Predict(QA)\nresult = predict(question='What is the capital of France?')\nprint(result.answer)\n# Optimize with labeled data\noptimizer = dspy.BootstrapFewShot(metric=my_metric)\noptimized = optimizer.compile(predict, trainset=examples)`,tip:'Start with dspy.Predict, then upgrade to dspy.ChainOfThought if accuracy is low.'},instructor:{use:'When you need structured, validated Python objects back from an LLM.',code:`import instructor\nfrom openai import OpenAI\nfrom pydantic import BaseModel\nfrom typing import List\nclient = instructor.from_openai(OpenAI())\nclass Entity(BaseModel):\n    name: str\n    entity_type: str\n    confidence: float\nclass Extraction(BaseModel):\n    entities: List[Entity]\nresult = client.chat.completions.create(\n    model='gpt-4o-mini',\n    response_model=Extraction,\n    messages=[{'role': 'user',\n        'content': 'Apple was founded by Steve Jobs in Cupertino.'}]\n)\nfor e in result.entities:\n    print(f'{e.name} ({e.entity_type}): {e.confidence:.0%}')`,tip:'Use model_validate_json for offline parsing. Add validators to Pydantic fields for auto-correction.'},fc_api:{use:'Letting LLMs call your Python functions reliably with structured arguments.',code:`from openai import OpenAI\nimport json\nclient = OpenAI()\ntools = [{\n    'type': 'function',\n    'function': {\n        'name': 'get_weather',\n        'description': 'Get current weather for a city',\n        'parameters': {\n            'type': 'object',\n            'properties': {\n                'city': {'type': 'string'},\n                'units': {'type': 'string', 'enum': ['celsius', 'fahrenheit']}\n            },\n            'required': ['city']\n        }\n    }\n}]\nresp = client.chat.completions.create(\n    model='gpt-4o', messages=[{'role':'user','content':'Weather in Tokyo?'}],\n    tools=tools, tool_choice='auto'\n)\ntool_call = resp.choices[0].message.tool_calls[0]\nargs = json.loads(tool_call.function.arguments)\nprint(args)`,tip:'Return JSON strings from your tool functions — models parse them better than plain text.'},st_lib:{use:'Generating embeddings for semantic search, RAG, and similarity tasks.',code:`from sentence_transformers import SentenceTransformer\nimport numpy as np\nmodel = SentenceTransformer('BAAI/bge-large-en-v1.5')\nsentences = [\n    'Machine learning is a subset of AI',\n    'Deep learning uses neural networks',\n    'Python is a programming language'\n]\nembeddings = model.encode(sentences, normalize_embeddings=True)\n# Cosine similarity (normalized = dot product)\nsim = embeddings @ embeddings.T\nprint(sim)\n# For queries, prefix with 'Represent this sentence:'\nquery = model.encode(['Represent: What is ML?'],\n    normalize_embeddings=True)`,tip:'BGE-large-en-v1.5 or gte-Qwen2-1.5B are best open-source choices as of 2024.'},oai_emb:{use:'Production semantic search and RAG where quality matters most.',code:`from openai import OpenAI\nimport numpy as np\nclient = OpenAI()\ndef embed(texts: list[str], model='text-embedding-3-large') -> np.ndarray:\n    resp = client.embeddings.create(input=texts, model=model)\n    return np.array([d.embedding for d in resp.data])\ndocs = ['Paris is the capital of France', 'Berlin is in Germany']\nquery = 'What is the French capital?'\ndoc_emb = embed(docs)\nq_emb = embed([query])\nscores = (q_emb @ doc_emb.T)[0]\nbest = docs[scores.argmax()]\nprint(f'Best match: {best}')`,tip:'text-embedding-3-small is 5× cheaper with only 5% less quality — use it for bulk processing.'},pinecone:{use:'Serverless managed vector search — no infra to manage.',code:`from pinecone import Pinecone, ServerlessSpec\npc = Pinecone(api_key='YOUR_KEY')\npc.create_index(\n    name='genai-docs', dimension=1536,\n    metric='cosine',\n    spec=ServerlessSpec(cloud='aws', region='us-east-1')\n)\nindex = pc.Index('genai-docs')\n# Upsert vectors\nindex.upsert(vectors=[\n    {'id': 'doc1', 'values': [0.1]*1536,\n     'metadata': {'text': 'hello', 'source': 'docs'}}\n])\n# Query\nresults = index.query(\n    vector=[0.1]*1536, top_k=3,\n    include_metadata=True,\n    filter={'source': {'$eq': 'docs'}}\n)\nprint(results['matches'])`,tip:'Use namespaces to isolate tenants without separate indexes.'},chroma:{use:'Local development RAG — zero setup, in-memory or persistent.',code:`import chromadb\nfrom chromadb.utils import embedding_functions\nclient = chromadb.PersistentClient(path='./chroma_db')\nef = embedding_functions.SentenceTransformerEmbeddingFunction(\n    model_name='BAAI/bge-small-en-v1.5'\n)\ncollection = client.get_or_create_collection(\n    name='docs', embedding_function=ef\n)\ncollection.add(\n    documents=['Python is great', 'FastAPI is fast'],\n    ids=['1', '2'],\n    metadatas=[{'source': 'wiki'}]*2\n)\nresults = collection.query(\n    query_texts=['best web framework'],\n    n_results=2\n)\nprint(results['documents'])`,tip:'Switch from chromadb.Client() to PersistentClient() to keep data between restarts.'},qdrant:{use:'Production vector DB with strong filtering and payload support.',code:`from qdrant_client import QdrantClient\nfrom qdrant_client.models import *\nclient = QdrantClient(':memory:')  # or 'http://localhost:6333'\nclient.create_collection('docs',\n    vectors_config=VectorParams(size=384, distance=Distance.COSINE)\n)\nclient.upsert('docs', points=[\n    PointStruct(id=1, vector=[0.1]*384,\n        payload={'text': 'hello', 'category': 'intro'})\n])\nresults = client.search('docs',\n    query_vector=[0.1]*384, limit=5,\n    query_filter=Filter(\n        must=[FieldCondition(\n            key='category',\n            match=MatchValue(value='intro')\n        )]\n    )\n)\nprint(results)`,tip:'Named vectors let you store multiple embedding models per document — great for multimodal.'},pgvector:{use:'Add semantic search to existing PostgreSQL databases.',code:`# pip install psycopg2-binary pgvector\nimport psycopg2\nfrom pgvector.psycopg2 import register_vector\nconn = psycopg2.connect('postgresql://localhost/mydb')\nregister_vector(conn)\ncur = conn.cursor()\ncur.execute('CREATE EXTENSION IF NOT EXISTS vector')\ncur.execute('''\n    CREATE TABLE IF NOT EXISTS docs (\n        id serial PRIMARY KEY,\n        content text,\n        embedding vector(1536)\n    )\n''')\n# Create HNSW index for fast search\ncur.execute('''\n    CREATE INDEX ON docs\n    USING hnsw (embedding vector_cosine_ops)\n    WITH (m=16, ef_construction=64)\n''')\ncur.execute('SELECT content FROM docs ORDER BY embedding <=> %s LIMIT 5',\n    ([0.1]*1536,))\nprint(cur.fetchall())`,tip:'HNSW index is 5-10× faster than IVFFlat — use it unless you have billions of rows.'},bm25:{use:'Keyword search when exact term matching matters alongside semantic search.',code:`# pip install rank-bm25\nfrom rank_bm25 import BM25Okapi\nimport string\ndef tokenize(text: str) -> list[str]:\n    text = text.lower().translate(\n        str.maketrans('', '', string.punctuation))\n    return text.split()\ncorpus = [\n    'machine learning algorithms optimize models',\n    'deep learning uses neural networks',\n    'python is great for data science'\n]\ntokenized = [tokenize(d) for d in corpus]\nbm25 = BM25Okapi(tokenized)\nscores = bm25.get_scores(tokenize('neural network optimization'))\nprint(list(zip(corpus, scores.round(3))))`,tip:'Combine BM25 + dense retrieval with Reciprocal Rank Fusion (RRF) for best results.'},rerank:{use:'After retrieving top-20 chunks, rerank to find the true top-3.',code:`# pip install cohere\nimport cohere\nclient = cohere.Client('YOUR_KEY')\ndocs = [\n    'Paris is the capital of France',\n    'France is known for wine',\n    'The Eiffel Tower is in Paris',\n    'Berlin is the capital of Germany'\n]\nresults = client.rerank(\n    model='rerank-english-v3.0',\n    query='What city is the capital of France?',\n    documents=docs,\n    top_n=2\n)\nfor r in results.results:\n    print(f'[{r.relevance_score:.3f}] {docs[r.index]}')`,tip:'Always retrieve 10-20 candidates before reranking to 3-5. The cost is trivial vs the quality gain.'},hyde:{use:'When queries are short/ambiguous and direct retrieval has low recall.',code:`from openai import OpenAI\nfrom sentence_transformers import SentenceTransformer\nclient = OpenAI()\nmodel = SentenceTransformer('BAAI/bge-large-en-v1.5')\ndef hyde_query(query: str, docs: list[str]):\n    # 1. Generate hypothetical answer\n    r = client.chat.completions.create(\n        model='gpt-4o-mini',\n        messages=[{'role':'user',\n            'content': f'Write a 2-sentence answer to: {query}'}]\n    )\n    hypothesis = r.choices[0].message.content\n    # 2. Embed hypothesis, not original query\n    h_emb = model.encode([hypothesis], normalize_embeddings=True)\n    d_emb = model.encode(docs, normalize_embeddings=True)\n    scores = (h_emb @ d_emb.T)[0]\n    return docs[scores.argmax()]\nprint(hyde_query('latency tricks for LLMs', my_docs))`,tip:'HyDE works best when the gap between query style and document style is large.'},llamaindex:{use:'Building production RAG pipelines with many data sources.',code:`from llama_index.core import VectorStoreIndex, SimpleDirectoryReader\nfrom llama_index.core.node_parser import SentenceSplitter\nfrom llama_index.embeddings.openai import OpenAIEmbedding\n# Load and index documents\ndocs = SimpleDirectoryReader('./docs').load_data()\nparser = SentenceSplitter(chunk_size=512, chunk_overlap=50)\nnodes = parser.get_nodes_from_documents(docs)\nindex = VectorStoreIndex(nodes,\n    embed_model=OpenAIEmbedding(model='text-embedding-3-small')\n)\n# Query with streaming\nengine = index.as_query_engine(streaming=True, similarity_top_k=5)\nresponse = engine.query('How does attention work?')\nresponse.print_response_stream()`,tip:'Use chunk_size=512 with chunk_overlap=50 as baseline. Tune based on your doc structure.'},langchain:{use:'Quickly chain prompts, tools, and retrievers for prototype pipelines.',code:`from langchain_openai import ChatOpenAI\nfrom langchain_core.prompts import ChatPromptTemplate\nfrom langchain_core.output_parsers import StrOutputParser\nllm = ChatOpenAI(model='gpt-4o-mini', temperature=0)\nprompt = ChatPromptTemplate.from_messages([\n    ('system', 'You are a helpful assistant.'),\n    ('human', '{question}')\n])\n# LCEL pipe syntax\nchain = prompt | llm | StrOutputParser()\nresult = chain.invoke({'question': 'What is RAG?'})\nprint(result)\n# Stream\nfor chunk in chain.stream({'question': 'Explain transformers'}):\n    print(chunk, end='', flush=True)`,tip:'Prefer LCEL (| pipe syntax) over legacy LLMChain — it supports streaming and async natively.'},langgraph:{use:'When your agent needs loops, conditionals, and persistent state.',code:`from langgraph.graph import StateGraph, END\nfrom typing import TypedDict, Annotated\nimport operator\nclass AgentState(TypedDict):\n    messages: Annotated[list, operator.add]\n    iterations: int\ndef call_llm(state):\n    # call your LLM here\n    return {'messages': ['response'], 'iterations': state['iterations']+1}\ndef should_continue(state):\n    return END if state['iterations'] >= 3 else 'call_llm'\ngraph = StateGraph(AgentState)\ngraph.add_node('call_llm', call_llm)\ngraph.set_entry_point('call_llm')\ngraph.add_conditional_edges('call_llm', should_continue)\napp = graph.compile()\nresult = app.invoke({'messages': [], 'iterations': 0})\nprint(result)`,tip:'Add checkpointers (MemorySaver, SqliteSaver) for resumable agents across sessions.'},crewai:{use:'Multi-agent workflows with role specialization and task delegation.',code:`from crewai import Agent, Task, Crew\nfrom crewai_tools import SerperDevTool\nresearcher = Agent(\n    role='Research Analyst',\n    goal='Find accurate information on AI trends',\n    backstory='Expert at synthesizing complex research',\n    tools=[SerperDevTool()], verbose=True\n)\nwriter = Agent(\n    role='Technical Writer',\n    goal='Write clear summaries of research',\n    backstory='Expert at making AI accessible'\n)\ntask = Task(\n    description='Research and summarize latest LLM benchmarks',\n    agent=researcher, expected_output='3-bullet summary'\n)\ncrew = Crew(agents=[researcher, writer], tasks=[task])\nresult = crew.kickoff()\nprint(result)`,tip:'Use process=Process.hierarchical for complex workflows where a manager agent coordinates.'},mcp:{use:'Standardizing tool integration across LLM clients (Claude, Cursor, etc.).',code:`# Create an MCP server in Python\n# pip install mcp\nfrom mcp.server.fastmcp import FastMCP\nmcp = FastMCP('My Tools')\n@mcp.tool()\ndef search_database(query: str, limit: int = 10) -> list[dict]:\n    """Search the company database for records.\n    \n    Args:\n        query: The search query\n        limit: Max results to return\n    \"\"\"\n    # Your implementation here\n    return [{'id': 1, 'result': f'Result for: {query}'}]\n@mcp.resource('file://docs/{path}')\ndef read_doc(path: str) -> str:\n    """Read a documentation file.\"\"\"\n    return open(f'./docs/{path}').read()\nif __name__ == '__main__':\n    mcp.run()`,tip:'Start with FastMCP for rapid development. Tools get auto-exposed to any MCP-compatible client.'},qlora4bit:{use:'Fine-tuning large models (7B-70B) on consumer or single datacenter GPU.',code:`# pip install transformers bitsandbytes peft accelerate\nimport torch\nfrom transformers import AutoModelForCausalLM, AutoTokenizer, BitsAndBytesConfig\nfrom peft import get_peft_model, LoraConfig, TaskType\nbnb_config = BitsAndBytesConfig(\n    load_in_4bit=True,\n    bnb_4bit_compute_dtype=torch.bfloat16,\n    bnb_4bit_quant_type='nf4',\n    bnb_4bit_use_double_quant=True\n)\nmodel = AutoModelForCausalLM.from_pretrained(\n    'meta-llama/Meta-Llama-3-8B',\n    quantization_config=bnb_config, device_map='auto'\n)\nlora_config = LoraConfig(\n    task_type=TaskType.CAUSAL_LM,\n    r=16, lora_alpha=32,\n    target_modules=['q_proj','v_proj'],\n    lora_dropout=0.1\n)\nmodel = get_peft_model(model, lora_config)\nmodel.print_trainable_parameters()`,tip:'Use r=16, alpha=32 as starting point. Increase r for complex tasks, decrease for efficiency.'},dpo:{use:'Aligning models to prefer certain outputs without needing a reward model.',code:`from datasets import Dataset\nfrom trl import DPOTrainer, DPOConfig\nfrom transformers import AutoModelForCausalLM, AutoTokenizer\nmodel = AutoModelForCausalLM.from_pretrained('my-sft-model')\nref_model = AutoModelForCausalLM.from_pretrained('my-sft-model')\ntokenizer = AutoTokenizer.from_pretrained('my-sft-model')\n# DPO requires (prompt, chosen, rejected) triplets\ndataset = Dataset.from_dict({\n    'prompt': ['Explain quantum computing'],\n    'chosen': ['Quantum computing uses qubits...'],\n    'rejected': ['I dont know, its complicated']\n})\ntrainer = DPOTrainer(\n    model=model, ref_model=ref_model,\n    args=DPOConfig(output_dir='./dpo-out', beta=0.1),\n    train_dataset=dataset, tokenizer=tokenizer\n)\ntrainer.train()`,tip:'beta=0.1 is the standard. Higher beta = closer to reference model. Use ORPO to skip ref model.'},unsloth:{use:'Cutting fine-tuning time by 2-5× on the same hardware.',code:`# pip install unsloth\nfrom unsloth import FastLanguageModel\nimport torch\nmodel, tokenizer = FastLanguageModel.from_pretrained(\n    model_name='unsloth/Meta-Llama-3.1-8B',\n    max_seq_length=2048,\n    load_in_4bit=True,\n)\nmodel = FastLanguageModel.get_peft_model(\n    model, r=16, target_modules=[\n        'q_proj','k_proj','v_proj','o_proj',\n        'gate_proj','up_proj','down_proj'\n    ],\n    lora_alpha=16, lora_dropout=0,\n    use_gradient_checkpointing='unsloth',\n)\n# Then use HF Trainer or TRL SFTTrainer normally\nprint(f'Trainable: {model.num_parameters()} params')`,tip:'Set target_modules to include gate_proj/up_proj/down_proj for MLP layers — boosts accuracy.'},trl:{use:'Full SFT→DPO→PPO training pipeline with HuggingFace integration.',code:`from trl import SFTTrainer, SFTConfig\nfrom transformers import AutoModelForCausalLM, AutoTokenizer\nfrom datasets import load_dataset\nmodel = AutoModelForCausalLM.from_pretrained('meta-llama/Meta-Llama-3-8B')\ntokenizer = AutoTokenizer.from_pretrained('meta-llama/Meta-Llama-3-8B')\ndataset = load_dataset('json', data_files='train.jsonl')['train']\ndef format_prompt(ex):\n    return {'text': f\"### Instruction: {ex['instruction']}\\n### Response: {ex['output']}\"}\ndataset = dataset.map(format_prompt)\ntrainer = SFTTrainer(\n    model=model, tokenizer=tokenizer,\n    args=SFTConfig(\n        output_dir='./sft-out',\n        per_device_train_batch_size=2,\n        gradient_accumulation_steps=4,\n        num_train_epochs=3,\n        learning_rate=2e-4\n    ),\n    train_dataset=dataset\n)\ntrainer.train()`,tip:'Combine with Unsloth by passing model through FastLanguageModel.get_peft_model() first.'},vllm:{use:'High-throughput LLM serving in production — 10-20× better GPU utilization.',code:`# Start server: python -m vllm.entrypoints.openai.api_server --model meta-llama/Meta-Llama-3-8B\n# Then use OpenAI client:\nfrom openai import OpenAI\nclient = OpenAI(base_url='http://localhost:8000/v1', api_key='dummy')\n# Batch generation (continuous batching is automatic)\nresponses = client.completions.create(\n    model='meta-llama/Meta-Llama-3-8B',\n    prompt=['Explain RAG in one sentence.'] * 10,\n    max_tokens=100, temperature=0.7\n)\nfor r in responses.choices:\n    print(r.text)\n# For structured output\nfrom vllm import LLM, SamplingParams\nllm = LLM(model='meta-llama/Meta-Llama-3-8B',\n    guided_decoding_backend='xgrammar')\nparams = SamplingParams(guided_decoding={'json': {'type': 'object'}})\nout = llm.generate(['Give me JSON: '], params)`,tip:'Use vllm serve --enable-prefix-caching to cache shared prompt prefixes across requests.'},ollama:{use:'Running open-source LLMs locally with a simple REST API.',code:`import ollama\n# Pull and run in Python\nclient = ollama.Client()\n# Stream a response\nfor chunk in client.chat(\n    model='llama3.1:8b',\n    messages=[{'role': 'user', 'content': 'Why is Python popular?'}],\n    stream=True\n):\n    print(chunk['message']['content'], end='', flush=True)\n# Embeddings\nemb = client.embeddings(\n    model='nomic-embed-text',\n    prompt='Hello world'\n)\nprint(len(emb['embedding']))  # 768\n# List available models\nmodels = client.list()\nprint([m['name'] for m in models['models']])`,tip:'Use Modelfile to customize system prompts and parameters permanently: FROM llama3.1:8b SYSTEM "..."'},gguf:{use:'Running quantized models locally with llama.cpp on CPU or consumer GPU.',code:`# pip install llama-cpp-python\nfrom llama_cpp import Llama\n# Load a GGUF model (download from HuggingFace)\nllm = Llama(\n    model_path='./Meta-Llama-3-8B-Instruct.Q4_K_M.gguf',\n    n_ctx=4096,\n    n_gpu_layers=35,  # Offload layers to GPU\n    n_threads=8\n)\n# Chat interface\noutput = llm.create_chat_completion(\n    messages=[{'role': 'user', 'content': 'What is 2+2?'}],\n    max_tokens=100, temperature=0.1\n)\nprint(output['choices'][0]['message']['content'])\n# Embeddings\nemb = llm.create_embedding('Hello world')\nprint(len(emb['data'][0]['embedding']))`,tip:'Q4_K_M is the best quality/size tradeoff. Q8_0 if you have RAM. Q2_K only if desperate.'},wandb:{use:'Track experiments, log artifacts, and compare model runs visually.',code:`import wandb\nimport torch\nwandb.init(project='llm-finetuning', config={\n    'model': 'llama-3-8b', 'lr': 2e-4, 'epochs': 3\n})\n# Log training metrics\nfor step, (loss, acc) in enumerate(training_loop()):\n    wandb.log({'loss': loss, 'accuracy': acc, 'step': step})\n# Log model artifact\nartifact = wandb.Artifact('fine-tuned-model', type='model')\nartifact.add_dir('./output')\nwandb.log_artifact(artifact)\n# LLM Weave tracing (automatic)\nimport weave\nweave.init('my-llm-app')\n@weave.op()\ndef my_llm_call(prompt: str) -> str:\n    # This call is auto-traced\n    return client.chat.completions.create(...)\nwandb.finish()`,tip:'Use wandb.watch(model) to log gradient histograms — invaluable for debugging training instability.'},langfuse:{use:'Tracing LLM app calls in production — find slow/expensive/wrong generations.',code:`from langfuse import Langfuse\nfrom langfuse.openai import openai  # Drop-in replacement\nlangfuse = Langfuse()\n# Option 1: OpenAI drop-in (auto-traces all calls)\nresponse = openai.chat.completions.create(\n    model='gpt-4o-mini',\n    messages=[{'role':'user','content':'Hello!'}],\n    name='my-generation'  # Shows in Langfuse UI\n)\n# Option 2: Manual tracing\ntrace = langfuse.trace(name='rag-pipeline', user_id='user123')\nspan = trace.span(name='retrieval')\n# ... do retrieval ...\nspan.end(output={'chunks': 5, 'latency_ms': 120})\ngen = trace.generation(name='generate',\n    model='gpt-4o', input=[...], output='...')\nlangfuse.flush()`,tip:'Use Langfuse Prompt Management to version and A/B test prompts without redeploying code.'},ragas:{use:'Measuring RAG pipeline quality with automated metrics.',code:`from ragas import evaluate\nfrom ragas.metrics import faithfulness, answer_relevancy, context_recall\nfrom datasets import Dataset\n# Prepare evaluation dataset\ndata = {\n    'question': ['What is RAG?'],\n    'answer': ['RAG stands for Retrieval Augmented Generation'],\n    'contexts': [['RAG combines retrieval with generation...']],\n    'ground_truth': ['RAG is a technique that grounds LLMs in retrieved documents']\n}\ndataset = Dataset.from_dict(data)\nresult = evaluate(\n    dataset,\n    metrics=[faithfulness, answer_relevancy, context_recall],\n)\nprint(result.to_pandas())`,tip:'Start with faithfulness + answer_relevancy. Add context_recall only when you have ground truth answers.'},cursor:{use:'AI-assisted coding with multi-file context and autonomous refactoring.',code:`# Cursor uses Claude/GPT-4o under the hood\n# Key patterns to get best results:\n\n# 1. Composer for multi-file changes\n# CMD+I -> describe the change you want\n# Add @file references for context\n\n# 2. Chat for understanding code\n# CMD+L -> highlight code + ask questions\n\n# 3. Rules (in .cursor/rules/*.mdc):\n# ---\n# description: Python coding standards\n# ---\n# - Always use type hints\n# - Prefer list comprehensions\n# - Use f-strings not .format()\n\n# 4. .cursorignore to exclude files\n# (like .gitignore but for AI context)\nprint("Cursor IDE: AI-native development")`,tip:'Use @ to pin specific files/docs as context. The more targeted context you provide, the better the suggestions.'},text2sql:{use:'Letting business users query databases using natural language.',code:`from openai import OpenAI\nclient = OpenAI()\ndef text_to_sql(question: str, schema: str) -> str:\n    response = client.chat.completions.create(\n        model='gpt-4o',\n        messages=[\n            {'role': 'system', 'content': f\"\"\"You are a SQL expert.\nDatabase schema:\n{schema}\nRules: Use only existing tables/columns. Return only the SQL query.\"\"\"},\n            {'role': 'user', 'content': question}\n        ]\n    )\n    return response.choices[0].message.content\nschema = \"\"\"users(id, name, email, created_at)\norders(id, user_id, total, status, created_at)\"\"\"\nprint(text_to_sql('Top 5 users by total spend last month', schema))`,tip:'Always include primary keys and foreign key relationships in the schema. Add 3-5 example rows for better results.'},livekit:{use:'Building real-time voice agents with sub-300ms end-to-end latency.',code:`# pip install livekit-agents livekit-plugins-openai\nfrom livekit.agents import AutoSubscribe, JobContext, WorkerOptions, cli\nfrom livekit.agents.voice_assistant import VoiceAssistant\nfrom livekit.plugins import openai, silero\nasync def entrypoint(ctx: JobContext):\n    await ctx.connect(auto_subscribe=AutoSubscribe.AUDIO_ONLY)\n    assistant = VoiceAssistant(\n        vad=silero.VAD.load(),\n        stt=openai.STT(),\n        llm=openai.LLM(model='gpt-4o-mini'),\n        tts=openai.TTS(voice='nova'),\n        chat_ctx={\n            'role': 'system',\n            'content': 'You are a helpful voice assistant'\n        }\n    )\n    assistant.start(ctx.room)\n    await asyncio.sleep(float('inf'))\ncli.run_app(WorkerOptions(entrypoint_fnc=entrypoint))`,tip:'Use silero VAD for accurate voice activity detection. ElevenLabs TTS for highest quality output.'}
