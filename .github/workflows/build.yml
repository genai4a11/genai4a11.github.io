name: Build — sync stats & sitemap

on:
  push:
    branches: [main]
    paths:
      # Re-run whenever source data or concept pages change
      - 'data/nodes.js'
      - 'data/snippets.js'
      - 'concepts/**.html'
      - 'scripts/gen-stats.py'
      - 'scripts/gen-sitemap.py'

permissions:
  contents: write          # needed to push the auto-commit

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so git_lastmod works correctly

      - name: Run build scripts
        run: python3 scripts/build.py

      - name: Commit generated files (if changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stats.js sitemap.xml
          if git diff --cached --quiet; then
            echo "Nothing changed — skipping commit."
          else
            git commit -m "chore: auto-update stats.js + sitemap.xml [skip ci]"
            git push
          fi
